name: Release

# Builds the Linux packages for a version tag (e.g. v0.2.0) and attaches
# them to the GitHub release. Can also be run by hand from the Actions
# tab, in which case the packages are only uploaded as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    name: Arch package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita blueprint-compiler cmake
      - uses: actions/checkout@v4
      - name: Build with makepkg
        # makepkg refuses to run as root.
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm"
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/channex-[0-9]*.pkg.tar.zst
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/arch/channex-[0-9]*.pkg.tar.zst

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Generate cargo-sources.json
        run: |
          pip install --break-system-packages aiohttp tomlkit
          curl -sSLo /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 /tmp/flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: channex.flatpak
          manifest-path: packaging/flatpak/io.github.niruxx.Channex.json
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: channex.flatpak
